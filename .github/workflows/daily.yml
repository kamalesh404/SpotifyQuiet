name: Daily build and test

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily:
    name: Daily test run
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: SpotifyQuiet-debug-apk-daily
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SpotifyQuiet-reports-daily
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Commit daily status
        run: |
          mkdir -p .daily
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) — tests passed, lint clean, APK built" > .daily/$(date -u +%Y-%m-%d).txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .daily/
          git diff --cached --quiet || git commit -m "Daily build: $(date -u +%Y-%m-%d)"
          git push
