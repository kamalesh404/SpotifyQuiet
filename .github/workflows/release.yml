name: Signed release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and sign release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing GitHub Actions secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the signing secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Decode keystore into a temporary file
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spotifyquiet-release.jks"
          echo "SPOTIFYQUIET_KEYSTORE_FILE=$RUNNER_TEMP/spotifyquiet-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintRelease --stacktrace

      - name: Build signed release APK
        env:
          SPOTIFYQUIET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPOTIFYQUIET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPOTIFYQUIET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SPOTIFYQUIET_REQUIRE_SIGNING: "true"
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the release APK is signed
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi
          jarsigner -verify -strict "$apk" | tee "$RUNNER_TEMP/jarsigner.txt"
          if ! grep -q "jar verified" "$RUNNER_TEMP/jarsigner.txt"; then
            echo "::error::Release APK is not signed; refusing to publish it"
            exit 1
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v5
        with:
          name: SpotifyQuiet-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/app-release.apk" \
            --title "SpotifyQuiet $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/spotifyquiet-release.jks"
